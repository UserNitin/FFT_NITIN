<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff;
      }
      .page {
        display: flex;
        min-height: 100vh;
      }
      .left-content {
        flex: 1.5;
      }
      .divider {
        width: 1px;
        background: #d1d5db;
      }
      .right-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }
      form {
        width: 100%;
        max-width: 560px;
      }
      form > h4:first-of-type {
        margin: 0 0 20px;
        font-size: 24px;
        font-weight: 600;
        color: #111827;
      }
      form div {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #4b5563;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 0 16px;
        height: 58px;
        box-sizing: border-box;
        border: 1px solid #c3cad5;
        border-radius: 14px;
        font-size: 16px;
        background: #fff;
      }
      button {
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 29px;
        background: #4267d5;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
      }
      button:hover {
        background: #3658bd;
      }
      a {
        color: #1877f2;
        text-decoration: none;
        font-size: 16px;
      }
      a:hover {
        background: rgb(176, 176, 176);
      }
      form div:nth-of-type(4) {
        text-align: center;
        margin: 20px 0 34px;
      }
      form div:nth-of-type(4) a {
        color: #111827;
      }
      form div:nth-of-type(5) {
        margin-bottom: 28px;
      }
      form div:nth-of-type(5) a {
        display: block;
        text-align: center;
        border: 1px solid #4c6ef5;
        color: #3157cf;
        border-radius: 29px;
        padding: 16px 10px;
        font-size: 17px;
      }
      form div:last-child {
        text-align: center;
        margin-bottom: 0;
      }
      form div:last-child h4 {
        margin: 0;
        font-size: 16px;
        color: #111827;
        font-weight: 600;
      }
      form div:last-child h4::before {
        content: "∞ ";
        color: #3157cf;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="left-content"></div>
      <div class="divider"></div>
      <div class="right-panel">
        <form>
          <h4>Log in to Facebook</h4>
          <div>
            <label for="email">Email or Phone:</label>
            <input type="text" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div>
            <button type="submit">Log In</button>
          </div>
          <div>
            <a href="#">Forgotten password?</a>
          </div>
          <div>
            <a href="#">Create New Account</a>
          </div>
          <div>
            <h4>Meta</h4>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
