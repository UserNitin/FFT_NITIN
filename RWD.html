<!DOCTYPE html>
<html lang="en">
<head>
    <title>Responsive Web Design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{
            background: lightblue;
        }
        p{
            background: lightgreen;
        }
        @media (max-width:600px){
            h1{
                background: lightcoral;
                text-align: center;
            }
            p{
                font-size: 20px;
                text-align: justify;
                background: lightyellow;
            }
            div{
                display:flex;
            }
        }
        img{
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h1>
        Responsive Web Design
    </h1>
    <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Facere nam impedit voluptatum, ab officiis possimus doloribus quo maxime, libero dolor quaerat optio a laudantium molestias magnam? Doloribus nam expedita suscipit.
    </p>
    <div>
        <img src="pexels-coding-1853305_1920.jpg" alt="">
        <img src="piro4d-fractal-environment-1728589_1920.jpg" alt="">
    </div>
</body>
</html>
