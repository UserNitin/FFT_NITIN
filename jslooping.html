<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <script>
        const a=Number(prompt("Enter a number:"));
        for (let i = 1; i <= 10; i++) {
            document.write(`${a} x ${i} = ${a * i}<br>`);
        }
    </script>
</body>
</html>
