<!DOCTYPE html>
<html lang="en">
<head>
    <title>Loading</title>
    <style>
        .load{
            width:100px;
            height:100px;
            border: 10px solid lightblue;
            border-top: 10px solid rgb(63, 101, 128);
            border-radius: 50%;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-name: he;
        }
        @keyframes he {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
    </style>
</head>
<body>
    <div class="load"></div>
</body>
</html>
