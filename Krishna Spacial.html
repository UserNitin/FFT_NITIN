<!DOCTYPE html>
<html>
<head>
    <title>Karishnaa Special</title>
    <style>
    img{
        width: 500px;
        height: 500px;
        display: block;
        margin: 0 auto;
        animation-name: move;
        animation-duration: 5s;
        animation-timing-function: ease;
        animation-delay: 1s;
        animation-direction: alternate;
        animation-iteration-count: infinite;
    }
    body{
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    div{
        border: 2px solid rgb(63, 101, 128);
        background-color: lightblue;
        border-radius: 10px;
        box-shadow: 0px 10px 20px rgba(10, 10, 10, 0.5);
    }
    @keyframes move {
        0% { transform: scale(1); }
        100% { transform: scale(1.2); }
    }
    h1{
        text-align:center;
        font-size: 70px;
    }
    h2{
        text-align:center;
        font-size: 30px;
        animation-name: move;
        animation-duration: 5s;
        animation-timing-function: ease;
        animation-delay: 1s;
        animation-direction: alternate;
        animation-iteration-count: infinite;
    }
    </style>
</head>
<body>
    <div>
    <h1>Karishnaa Special</h1>
    <img src="ChatGPT Image Sep 4, 2026, 04_38_35 PM.png" alt="">
    <br>
    <br>
    <h2>Happy Birthday krishnaa</h2>
    </div>
</body>
</html>
